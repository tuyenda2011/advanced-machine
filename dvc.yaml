stages:
  prepare:
    cmd: python scripts/prepare_data.py --no-export_csv
    deps:
      - scripts/prepare_data.py
      - src/data/loader.py
      - src/data/preprocessing.py
      - src/data/splitter.py
      - src/data/text_encoder.py
      - src/data/negative_collector.py
      - src/data/validation.py
      - configs/common.yaml
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/mappings.pkl
      - data/processed/item_text_embeddings.pt
      - data/processed/disliked_interactions.parquet

  audit:
    cmd: python scripts/audit_data.py
    deps:
      - scripts/audit_data.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/mappings.pkl
      - data/processed/item_text_embeddings.pt
      - data/processed/disliked_interactions.parquet
    outs:
      - data/processed/audit_report.json:
          cache: false
