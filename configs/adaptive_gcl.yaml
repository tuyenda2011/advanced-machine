model_name: "adaptive_gcl"

adaptive_gcl:
  text_policy: "masked_text"
  feature_view: "shared" # shared evaluation text or adaptivegcl_quality derived view
  fusion_mode: "bounded_residual" # cap item/user semantic norms relative to ID embeddings
  residual_alpha_init: 0.1 # learned residual scale initialization
  residual_alpha_max: 1.0 # upper bound for learned residual scale
  text_dim: 384
  use_item_text: true # false bypasses item fusion only, not user text or SSL
  user_semantic_weight: 0.5 # 0 bypasses the user semantic MLP
  user_semantic_gate: true # learned per-user semantic contribution, initialized at 0.1
  ssl_target: "frozen_text" # separate graph projection predicts fixed encoder features
  layer_aggregation: "anchored" # 50% uniform graph depths + 50% learned weights
  mlp_weight_decay: 0.0 # Adam L2 on MLP matrices only; tune on validation
  ssl_temp: 0.2
  ssl_reg: 0.01 # reduced semantic SSL; validate ranking against no_ssl
  dirichlet_reg: 0.0 # experimental; high energy does not guarantee non-collapse
  node_dropout: 0.05
  tau_plus: 0.0 # ordinary InfoNCE; positive priors are opt-in experiments
  hard_neg_alpha: 0.2
  hard_neg_margin: 0.5
